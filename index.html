    <!-- Before the app has started: Chip's loader as the app draws it (ChipLoader, app.css), so
         nothing jumps when it takes over. -->
    <style>
      html, body { background: #f7f7fb; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; font-family: 'Inter Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #boot::before, #boot::after { content: ''; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: 0.55; }
      #boot::before { left: -25vmax; top: -30vmax; background: radial-gradient(circle, #e7e2ff 0%, transparent 65%); }
      #boot::after { right: -30vmax; bottom: -35vmax; background: radial-gradient(circle, #dff1ff 0%, transparent 65%); }
      #boot .l { position: relative; display: grid; justify-items: center; gap: 36px; }
      #boot .g, #boot .r { position: absolute; left: 50%; border-radius: 50%; }
      #boot .g { top: -40px; width: 151px; height: 151px; margin-left: -75.5px; background: radial-gradient(circle, rgb(139 125 255 / 0.3) 0%, rgb(79 180 240 / 0.12) 42%, transparent 68%); animation: bg 3.2s cubic-bezier(0.2, 0.7, 0.1, 1) infinite; }
      #boot .r { top: -16px; width: 104px; height: 104px; margin-left: -52px; background: conic-gradient(from 0deg, transparent 0 58%, rgb(139 125 255 / 0.05) 62%, rgb(139 125 255 / 0.7) 90%, #fff 97%, transparent 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); animation: bs 1.8s linear infinite; }
      #boot .o { position: relative; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 32% 28%, #fff 0%, #c9c3ff 18%, #8b7dff 46%, #4fb4f0 78%, #5fd8b6 100%); box-shadow: inset -3px -4px 10px rgb(40 30 140 / 0.25), 0 8px 26px rgb(100 87 240 / 0.38); animation: ba 3.2s cubic-bezier(0.2, 0.7, 0.1, 1) infinite; }
      #boot .s { position: absolute; inset: -30%; background: conic-gradient(from 0deg, transparent 0deg, rgb(255 255 255 / 0.55) 40deg, transparent 90deg, transparent 360deg); opacity: 0.75; animation: bs 5s linear infinite; }
      #boot .f { position: absolute; left: 50%; top: 46%; display: flex; gap: 18%; width: 46%; justify-content: center; transform: translate(-50%, -50%); animation: bl 6s cubic-bezier(0.2, 0.7, 0.1, 1) infinite; }
      #boot .f i { width: 18%; aspect-ratio: 0.62; background: #fff; border-radius: 999px; box-shadow: 0 0 4px rgb(255 255 255 / 0.9); animation: bb 6.5s infinite; }
      #boot p { margin: 0; font-size: 15.2px; font-weight: 500; letter-spacing: -0.01em; color: #6c6e8a; }
      #boot p i { display: inline-block; width: 4px; height: 4px; margin-left: 3px; border-radius: 50%; background: currentColor; vertical-align: middle; animation: bd 1.4s cubic-bezier(0.2, 0.7, 0.1, 1) infinite; }
      #boot p i:nth-child(2) { animation-delay: 0.2s; }
      #boot p i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes ba { 50% { transform: scale(1.045); } }
      @keyframes bg { 0%, 100% { opacity: 0.65; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes bs { to { transform: rotate(360deg); } }
      @keyframes bl { 0%, 16%, 100% { transform: translate(-50%, -50%); } 26%, 40% { transform: translate(-63%, -53%); } 52%, 66% { transform: translate(-37%, -53%); } 78%, 88% { transform: translate(-50%, -44%); } }
      @keyframes bb { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @keyframes bd { 0%, 100% { opacity: 0.2; } 40% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } #boot .r { opacity: 0.45; } #boot p i { opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" role="status"><div class="l"><span class="g"></span><span class="r"></span><span class="o"><span class="s"></span><span class="f"><i></i><i></i></span></span><p>Opening Chip Study<span aria-hidden="true"><i></i><i></i><i></i></span></p></div></div></div>
    <noscript>Chip Study needs JavaScript switched on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
